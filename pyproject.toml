[project]
name = "toutiao-backend"
version = "0.1.0"
description = "头条新闻后端（FastAPI + SQLAlchemy 异步 + Redis）"
requires-python = ">=3.9"
dependencies = [
    # Web 框架
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.51",
    "aiomysql>=0.3.2",
    # 缓存
    # 注意: redis-py 8.x 默认 RESP3 (发 HELLO 命令)，本机 Redis 3.0 服务端不支持 → 限制 <7
    "redis>=4.6,<7",
    # 配置 / 校验
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # 认证
    # 注意: bcrypt 必须 <4.1 —— passlib 1.7.4 读 bcrypt.__about__，4.1+ 删了该属性会 AttributeError
    "passlib>=1.7.4",
    "bcrypt>=4.0,<4.1",
    # AI 聊天转发
    "httpx>=0.28.0",
]
